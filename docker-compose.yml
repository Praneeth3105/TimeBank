services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: timebank
      POSTGRES_USER: timebank
      POSTGRES_PASSWORD: timebank_dev_password
    ports:
      - "5432:5432"
    volumes:
      - timebank_pgdata:/var/lib/postgresql/data
volumes:
  timebank_pgdata:
